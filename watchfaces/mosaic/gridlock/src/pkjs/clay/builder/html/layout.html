<div class="component lb">
  <div class="lb-header">
    <p class="lb-desc">Pick a layout, then drag icons in to place them.<br>Drag blocks to move or remove. Every edit is kept.</p>
  </div>
  <div class="lb-modes"></div>
  <div class="lb-middle-wrap">
    <div class="lb-bezel">
      <div class="lb-grid"></div>
      <div class="lb-actions-side">
        <button type="button" class="lb-btn lb-preset" data-preset="default">Default</button>
        <button type="button" class="lb-btn lb-preset" data-preset="1">Activity</button>
        <button type="button" class="lb-btn lb-preset" data-preset="2">Weather</button>
        <button type="button" class="lb-btn lb-preset" data-preset="3">Data</button>
        <button type="button" class="lb-btn lb-preset" data-preset="4">Sleep</button>
        <button type="button" class="lb-btn lb-preset" data-preset="5">Creator</button>
      </div>
    </div>
  </div>
  <div class="lb-actions-bar">
    <button type="button" class="lb-btn lb-btn-io">Import / Export</button>
    <button type="button" class="lb-btn lb-btn-clear">Clear</button>
  </div>
  <div class="lb-palette-container"></div>
  <input type="hidden" class="lb-value">
</div>
