<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>VS Code</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@600&display=swap">
        <!-- shared Pebble-64 palette: defines the --GColor* variables the themes use -->
        <link rel="stylesheet" type="text/css" href="../paf/plugins/frame/css/pebble-colors.css">
        <link rel="stylesheet" type="text/css" href="css/frame.css">
        <link rel="stylesheet" type="text/css" href="css/theme_dark.css">
    </head>
    <body>
        <div class="viewport">
            <div class="watch">
                <!-- title / menu bar: baked chrome -->
                <header class="titlebar">
                    <div class="menu">
                        <span>File</span>
                        <span>Edit</span>
                        <span>Help</span>
                    </div>
                    <div class="wins">
                        <svg width="7" height="7" viewBox="0 0 7 7" aria-hidden="true"><path d="M0 3.5H7"/></svg>
                        <svg width="7" height="7" viewBox="0 0 7 7" aria-hidden="true"><rect x="0.5" y="0.5" width="6" height="6"/></svg>
                        <svg width="7" height="7" viewBox="0 0 7 7" aria-hidden="true"><path d="M0.5 0.5L6.5 6.5M6.5 0.5L0.5 6.5"/></svg>
                    </div>
                </header>

                <!-- activity bar: explorer, search, source control, debug, and extensions, each a rendered
                     icon painted the theme's colour through a mask -->
                <nav class="activity">
                    <i class="icon active files"></i>
                    <i class="icon search"></i>
                    <i class="icon git"></i>
                    <i class="icon debug"></i>
                    <i class="icon extensions"></i>
                </nav>

                <!-- editor tab strip: baked chrome. its right end is left empty for the app-drawn
                     Quiet Time and bluetooth glyphs and the battery -->
                <div class="tabs">
                    <div class="tab">
                        <span class="file-icon">TS</span>
                        <span>time.ts</span>
                        <span class="close">&times;</span>
                    </div>
                </div>
                <span class="data batt">87%</span>

                <!-- editor pane: the app draws the clock and the date live -->
                <div class="time">10:42</div>
                <div class="data date">JUN 18</div>

                <!-- integrated terminal: tabs, prompt, and readout glyphs baked, values app-drawn -->
                <div class="panel">
                    <div class="panel-tabs">
                        <span>PROBLEMS</span>
                        <span>OUTPUT</span>
                        <span class="active">TERMINAL</span>
                    </div>
                    <div class="term-prompt"><span class="ps">PS E:\&gt;</span> <span class="cmd">./status.sh</span></div>
                </div>

                <!-- readout glyphs, rendered from icons.json and painted the theme's colour through a mask.
                     the weather glyph is app-drawn, so its spot is left empty -->
                <i class="glyph temp"></i>
                <i class="glyph hr"></i>
                <i class="glyph steps"></i>

                <span class="data cond">CLDY</span>
                <span class="data temp">21C</span>
                <span class="data hr">72</span>
                <span class="data steps">6214</span>

                <!-- status bar: baked chrome -->
                <footer class="statusbar">
                    <div class="left">
                        <i class="icon branch"></i>
                        <span>main</span>
                        <svg class="gap" width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="3.4"/><path d="M2.6 2.6L5.4 5.4M5.4 2.6L2.6 5.4"/></svg>
                        <span>0</span>
                        <svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path d="M4 0.6L7.5 7.4H0.5Z M4 3V5"/></svg>
                        <span>0</span>
                    </div>
                    <div class="right">
                        <span>UTF-8</span>
                        <span>{ } TS</span>
                        <svg width="7" height="8" viewBox="0 0 7 8" aria-hidden="true"><path d="M1 6V3.5A2.5 2.5 0 0 1 6 3.5V6H1Z M2.8 7.2H4.2"/></svg>
                    </div>
                </footer>
            </div>
        </div>
        <script>
            // ?frame switches to the shipped chrome-only bake: clear the live
            // readouts so only the static frame chrome is captured
            if (location.search.indexOf('frame') >= 0) {
              document.documentElement.classList.add('frame-render');
              document.querySelectorAll('.time, .data')
                      .forEach(function (el) { el.textContent = ''; });
            }
        </script>
    </body>
</html>
