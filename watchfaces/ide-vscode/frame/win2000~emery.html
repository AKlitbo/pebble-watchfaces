<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2000</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=VT323&display=swap">
        <link rel="stylesheet" type="text/css" href="../paf/plugins/frame/css/pebble-colors.css">
        <!-- the name leaves out theme_, so the theme swap the VS Code bake does leaves it alone -->
        <link rel="stylesheet" type="text/css" href="css/desktop_win2000.css">
    </head>
    <body>
        <div class="viewport">
            <div class="watch w2k">
                <!-- the Watch Properties dialog: the app draws the clock, the date, and each sensor's value -->
                <div class="raised dialog"></div>
                <div class="title">
                    <span class="name">Watch Properties</span>
                    <span class="raised btn">?</span>
                    <span class="raised btn"><svg width="6" height="6" viewBox="0 0 6 6" aria-hidden="true"><path d="M0.5 0.5L5.5 5.5M5.5 0.5L0.5 5.5"/></svg></span>
                </div>
                <div class="tabs">
                    <span class="raised tab">Time</span>
                    <span class="tab other">Health</span>
                    <span class="tab other">Weather</span>
                </div>
                <div class="panel"></div>

                <div class="group clock"><b>Current Time</b></div>
                <div class="group sensors"><b>Sensors</b></div>

                <span class="label" style="left: 16px; top: 129px">Temperature</span>
                <span class="label" style="left: 104px; top: 129px">Heart Rate</span>
                <span class="label" style="left: 16px; top: 162px">Weather</span>
                <span class="label" style="left: 104px; top: 162px">Steps</span>
                <div class="sunk field" style="left: 16px; top: 141px"></div>
                <div class="sunk field" style="left: 104px; top: 141px"></div>
                <div class="sunk field" style="left: 16px; top: 174px"></div>
                <div class="sunk field" style="left: 104px; top: 174px"></div>

                <div class="time">10:42</div>
                <div class="data date">JUN 18</div>
                <span class="data val" style="left: 19px; top: 143px">21C</span>
                <span class="data val" style="left: 107px; top: 143px">72 bpm</span>
                <span class="data val" style="left: 19px; top: 176px">CLDY</span>
                <span class="data val" style="left: 107px; top: 176px">8431</span>

                <!-- the taskbar: the tray's battery, bluetooth, and Quiet Time are app-drawn -->
                <div class="raised taskbar"></div>
                <div class="raised start">
                    <svg class="glyph" width="10" height="10" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><g class="strap" fill="#555555"><rect x="3" y="0" width="4" height="1"/><rect x="3" y="9" width="4" height="1"/></g><g class="body" fill="#000000"><rect x="2" y="1" width="6" height="1"/><rect x="1" y="2" width="8" height="6"/><rect x="2" y="8" width="6" height="1"/></g><rect class="pane-a" x="2" y="2" width="3" height="3" fill="#FF5500"/><rect class="pane-b" x="5" y="2" width="3" height="3" fill="#55AA00"/><rect class="pane-c" x="2" y="5" width="3" height="3" fill="#0055FF"/><rect class="pane-d" x="5" y="5" width="3" height="3" fill="#FFAA00"/></svg>
                    Start
                </div>
                <div class="sunk task">Watch Properties</div>
                <div class="sunk tray"></div>
            </div>
        </div>
        <script>
            // ?frame switches to the shipped chrome-only bake: clear the live
            // readouts so only the static frame chrome is captured
            if (location.search.indexOf('frame') >= 0) {
              document.documentElement.classList.add('frame-render');
              document.querySelectorAll('.time, .data')
                      .forEach(function (el) { el.textContent = ''; });
            }
        </script>
    </body>
</html>
