<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOS</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
        <link rel="stylesheet" type="text/css" href="../paf/plugins/frame/css/pebble-colors.css">
        <!-- the name leaves out theme_, so the theme swap the VS Code bake does leaves it alone -->
        <link rel="stylesheet" type="text/css" href="css/desktop_dos.css">
    </head>
    <body>
        <div class="viewport">
            <div class="watch">
                <!-- the clock panel: the app draws the clock and the date -->
                <div class="panel clock"><b>C:\WATCH\CLOCK.EXE</b></div>

                <!-- the file panel, with a mini status line for the highlighted file -->
                <div class="panel files">
                    <b>C:\WATCH</b>
                    <div class="list">
                        <div class="dir">..</div>
                        <div>clock&#160;&#160;&#160;c</div>
                        <div class="pick">weather&#160;c</div>
                        <div>health&#160;&#160;c</div>
                        <div>steps&#160;&#160;&#160;c</div>
                        <div>battery&#160;c</div>
                        <div class="exe">face&#160;&#160;pbw</div>
                    </div>
                    <div class="mini">2048&#160;B</div>
                </div>

                <!-- the Info panel: labels baked, values app-drawn -->
                <div class="panel info"><b>Info</b></div>
                <span class="label" style="top: 91px">temp</span>
                <span class="label" style="top: 105px">sky</span>
                <span class="label" style="top: 119px">heart</span>
                <span class="label" style="top: 133px">steps</span>
                <span class="label" style="top: 147px">bt</span>
                <span class="label" style="top: 161px">quiet</span>
                <span class="label" style="top: 175px">batt</span>

                <div class="prompt">C:\WATCH&gt;<span class="cursor">_</span></div>
                <div class="keys">
                    <span>1<i>Help</i></span><span>3<i>View</i></span><span>4<i>Edit</i></span><span>5<i>Copy</i></span><span>10<i>Quit</i></span>
                </div>

                <div class="time">10:42</div>
                <div class="data date">THU 18 JUN</div>
                <span class="data val" style="top: 91px">21C</span>
                <span class="data val" style="top: 105px">CLDY</span>
                <span class="data val" style="top: 119px">72 bpm</span>
                <span class="data val" style="top: 133px">8431</span>
                <span class="data val on" style="top: 147px">LINK</span>
                <span class="data val quiet" style="top: 161px">ON</span>
                <span class="data val" style="top: 175px">80%</span>
            </div>
        </div>
        <script>
            // ?frame switches to the shipped chrome-only bake: clear the live
            // readouts so only the static frame chrome is captured
            if (location.search.indexOf('frame') >= 0) {
              document.documentElement.classList.add('frame-render');
              document.querySelectorAll('.time, .data')
                      .forEach(function (el) { el.textContent = ''; });
            }
        </script>
    </body>
</html>
