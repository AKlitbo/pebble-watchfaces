<div class="component sb">
  <div class="sb-header">
    <p class="sb-desc">Drag a readout onto a panel.<br>Drag one panel onto another to swap them.</p>
  </div>
  <div class="sb-face-wrap">
    <div class="sb-face">
      <div class="sb-rail">
        <div class="sb-rail-block sb-rail-1"></div>
        <div class="sb-rail-block sb-rail-2"></div>
      </div>
      <div class="sb-slots">
        <div class="sb-slot" data-slot="0"></div>
        <div class="sb-slot" data-slot="2"></div>
        <div class="sb-slot" data-slot="1"></div>
        <div class="sb-slot" data-slot="3"></div>
      </div>
    </div>
    <div class="sb-actions">
      <button type="button" class="sb-btn sb-preset" data-preset="default">Default</button>
      <button type="button" class="sb-btn sb-btn-clear">Clear</button>
    </div>
  </div>
  <div class="sb-palette"></div>
  <input type="hidden" class="sb-value">
</div>
