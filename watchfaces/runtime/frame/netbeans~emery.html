<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NetBeans</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cousine:wght@400;700&family=Noto+Sans:wght@400;600&family=Pixelify+Sans&family=Share+Tech+Mono&display=swap">
        <link rel="stylesheet" type="text/css" href="../paf/plugins/frame/css/pebble-colors.css">
        <!-- the name leaves out theme_, so the theme swap the VS Code bake does leaves it alone -->
        <link rel="stylesheet" type="text/css" href="css/desktop_netbeans.css">
    </head>
    <body>
        <div class="viewport">
            <div class="watch nb">
                <div class="menu"><span>File</span><span>Edit</span><span>View</span><span>Source</span><span>Run</span></div>

                <!-- the toolbar: open, save, build, run, and debug. its right end is left empty for the
                     app-drawn Quiet Time, bluetooth, and battery -->
                <div class="toolbar">
                    <i class="icon open"></i>
                    <i class="icon save"></i>
                    <span class="sep"></span>
                    <i class="icon build"></i>
                    <svg class="run" width="11" height="11" viewBox="0 0 11 11" aria-hidden="true"><path d="M2 1V10L10 5.5Z"/></svg>
                    <i class="icon debug"></i>
                </div>

                <div class="side"><span>Projects</span><span>Files</span></div>

                <div class="tabs">
                    <span class="tab on">Clock.java<b>&times;</b></span>
                    <span class="tab">Weather.java</span>
                    <span class="tab">Health.java</span>
                </div>

                <!-- the editor: the app draws the clock and the date as the value of now -->
                <div class="editor">
                    <div class="gutter"><span style="top: 3px">1</span><span style="top: 21px">2</span><span style="top: 77px">3</span></div>
                    <div class="code"><span class="keyword">String</span> now =</div>
                </div>

                <!-- the output panel: the readout glyphs are baked, the weather glyph and the values
                     app-drawn -->
                <div class="output">
                    <div class="head">Output - Watch (run)</div>
                    <div class="done">BUILD SUCCESSFUL (total time: 0 seconds)</div>
                </div>
                <i class="glyph hr"></i>
                <i class="glyph temp"></i>
                <i class="glyph steps"></i>

                <div class="status"><span>2:5</span><span>INS</span></div>

                <div class="time">10:42</div>
                <div class="data date">"JUN 18";</div>
                <span class="data val cond" style="left: 31px; top: 164px">CLDY</span>
                <span class="data val hr" style="left: 119px; top: 164px">72</span>
                <span class="data val temp" style="left: 31px; top: 179px">21C</span>
                <span class="data val steps" style="left: 119px; top: 179px">6214</span>
            </div>
        </div>
        <script>
            // ?frame switches to the shipped chrome-only bake: clear the live
            // readouts so only the static frame chrome is captured
            if (location.search.indexOf('frame') >= 0) {
              document.documentElement.classList.add('frame-render');
              document.querySelectorAll('.time, .data')
                      .forEach(function (el) { el.textContent = ''; });
            }
        </script>
    </body>
</html>
