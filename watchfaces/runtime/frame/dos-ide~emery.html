<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DOS IDE</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
        <link rel="stylesheet" type="text/css" href="../paf/plugins/frame/css/pebble-colors.css">
        <!-- the name leaves out theme_, so the theme swap the VS Code bake does leaves it alone -->
        <link rel="stylesheet" type="text/css" href="css/desktop_dos-ide.css">
    </head>
    <body>
        <div class="viewport">
            <div class="watch">
                <div class="menu">
                    <span>&#8801;</span><span><i>F</i>ile</span><span><i>E</i>dit</span><span><i>R</i>un</span><span><i>C</i>ompile</span><span><i>D</i>ebug</span>
                </div>

                <!-- the editor window: the app draws the clock and the date as the value of now -->
                <div class="win editor"><b>[&#9632;] CLOCK.CPP 1=[&#8597;]</b></div>
                <span class="code">char *now =</span>

                <!-- the Watch window: labels baked, values app-drawn -->
                <div class="win watchlist"><b>&#9552; Watch &#9552;</b></div>
                <span class="label" style="left: 6px; top: 148px">temp:</span>
                <span class="label" style="left: 92px; top: 148px">sky:</span>
                <span class="label" style="left: 6px; top: 162px">hr:</span>
                <span class="label" style="left: 92px; top: 162px">steps:</span>
                <span class="label" style="left: 6px; top: 176px">bt:</span>
                <span class="label" style="left: 92px; top: 176px">quiet:</span>
                <span class="label" style="left: 6px; top: 190px">batt:</span>

                <div class="status">
                    <span><i>F1</i> Help</span><span><i>F2</i> Save</span><span><i>F9</i> Make</span><span><i>F10</i> Menu</span>
                </div>

                <div class="time">10:42</div>
                <div class="data date">"THU 18 JUN";</div>
                <span class="data val" style="left: 54px; top: 148px">21C</span>
                <span class="data val" style="left: 148px; top: 148px">CLDY</span>
                <span class="data val" style="left: 54px; top: 162px">72</span>
                <span class="data val" style="left: 148px; top: 162px">6214</span>
                <span class="data val" style="left: 54px; top: 176px">LINK</span>
                <span class="data val" style="left: 148px; top: 176px">OFF</span>
                <span class="data val" style="left: 54px; top: 190px">87%</span>
            </div>
        </div>
        <script>
            // ?frame switches to the shipped chrome-only bake: clear the live
            // readouts so only the static frame chrome is captured
            if (location.search.indexOf('frame') >= 0) {
              document.documentElement.classList.add('frame-render');
              document.querySelectorAll('.time, .data')
                      .forEach(function (el) { el.textContent = ''; });
            }
        </script>
    </body>
</html>
