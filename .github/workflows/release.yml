name: Release

# name the run after the commit being released. left unset, GitHub only falls back to the commit
# message when the tag sits on the branch tip, and shows the workflow name ("Release") for a tag
# on any older commit, which tells you nothing about what shipped
run-name: ${{ github.event.head_commit.message }}

# faces version independently, so a release is tagged per face as <face>-v<version>, such as
# ridgeline-v1.5.0. pushing that tag is the whole release process
on:
  push:
    tags: ['*-v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # the engine is a submodule at lib/. a full submodule clone carries the engine's tags, which
      # the release check reads
      - name: Checkout Engine
        run: git submodule update --init

      # every check that can stop a release runs here, before the SDK install and the build, so a
      # mistyped tag or an undated changelog costs seconds
      - name: Prepare Release
        id: release
        uses: ./lib/.github/actions/prepare-release

      - uses: ./lib/.github/actions/setup-pebble

      - name: Build Watchface
        run: bash lib/build.sh ${{ steps.release.outputs.face }}

      - name: Publish Release
        uses: ./lib/.github/actions/publish-release
        with:
          face: ${{ steps.release.outputs.face }}
          version: ${{ steps.release.outputs.version }}
          title: ${{ steps.release.outputs.title }}
          notes-file: ${{ steps.release.outputs.notes-file }}
