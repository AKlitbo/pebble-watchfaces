name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  # build each watchface (regenerates the manifest, compiles the TS pkjs, runs pebble build).
  # one job per face so a failing face does not block the others' artifacts
  pebble:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        face: [radar-array, ide-vscode, gridlock, sidereel, ridgeline, shoreline, treeline]
    steps:
      - uses: actions/checkout@v7

      # the framework is a submodule at lib/
      - name: Checkout Framework
        run: git submodule update --init

      - uses: ./lib/.github/actions/setup-pebble

      # tee'd because the SDK's memory report is printed during the link and is the only place
      # the heap figure exists. shell: bash for pipefail, or a failed build would pass as long as
      # tee succeeded
      - name: Build Watchface
        shell: bash
        run: bash lib/build.sh ${{ matrix.face }} | tee build-${{ matrix.face }}.log

      # runs after a failed build too, so a face that broke still shows up as missing its rows
      - name: Report Memory
        if: always()
        uses: ./lib/.github/actions/report-memory
        with:
          face: ${{ matrix.face }}
          log: build-${{ matrix.face }}.log

      - uses: actions/upload-artifact@v7
        with:
          name: pbw-${{ matrix.face }}
          path: |
            targets/${{ matrix.face }}*/build/*.pbw
          if-no-files-found: error

  memory:
    runs-on: ubuntu-latest
    needs: pebble
    if: always()
    steps:
      - uses: actions/checkout@v7

      # the framework is a submodule at lib/
      - name: Checkout Framework
        run: git submodule update --init

      - name: Render Memory
        uses: ./lib/.github/actions/render-memory

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the framework is a submodule at lib/
      - name: Checkout Framework
        run: git submodule update --init
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the framework is a submodule at lib/
      - name: Checkout Framework
        run: git submodule update --init
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the framework is a submodule at lib/
      - name: Checkout Framework
        run: git submodule update --init
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
