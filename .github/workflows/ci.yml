name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  # build each watchface (regenerates the manifest, compiles the TS pkjs, runs pebble build).
  # one job per face so a failing face does not block the others' artifacts. each face builds in its
  # own paf unit, the family or face folder under watchfaces/ that holds it
  pebble:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { face: radar-array, unit: watchfaces/radar-array }
          - { face: ide-vscode, unit: watchfaces/ide-vscode }
          - { face: gridlock, unit: watchfaces/mosaic }
          - { face: sidereel, unit: watchfaces/mosaic }
          - { face: ridgeline, unit: watchfaces/sketchbook }
          - { face: shoreline, unit: watchfaces/sketchbook }
          - { face: treeline, unit: watchfaces/sketchbook }
    steps:
      - uses: actions/checkout@v7

      # paf fills the unit's paf/ from the framework tag in its paf.config.json and installs its
      # node_modules from the committed lock
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
        with:
          face: ${{ matrix.face }}

      - uses: AKlitbo/pebble-app-framework/.github/actions/setup-pebble@v4.0.0
        with:
          face: ${{ matrix.face }}

      # tee'd because the SDK's memory report is printed during the link and is the only place
      # the heap figure exists. shell: bash for pipefail, or a failed build would pass as long as
      # tee succeeded
      - name: Build Watchface
        shell: bash
        run: paf build ${{ matrix.face }} | tee build-${{ matrix.face }}.log

      # runs after a failed build too, so a face that broke still shows up as missing its rows
      - name: Report Memory
        if: always()
        uses: AKlitbo/pebble-app-framework/.github/actions/report-memory@v4.0.0
        with:
          face: ${{ matrix.face }}
          log: build-${{ matrix.face }}.log

      - uses: actions/upload-artifact@v7
        with:
          name: pbw-${{ matrix.face }}
          path: |
            ${{ matrix.unit }}/targets/${{ matrix.face }}*/build/*.pbw
          if-no-files-found: error

  memory:
    runs-on: ubuntu-latest
    needs: pebble
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Render Memory
        uses: AKlitbo/pebble-app-framework/.github/actions/render-memory@v4.0.0

  # the checks run in every unit, each against its own framework
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
      - run: paf test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
      - run: paf lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
      - run: paf typecheck

  # the generated files each face commits, such as its Clay components and thumbnails, still match
  # what the framework's generators would write
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: AKlitbo/pebble-app-framework-cli/.github/actions/sync@v2.0.0
      - run: paf check
